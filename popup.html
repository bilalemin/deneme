<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA سودا سۇپىسى</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary-color: #f27a1a;
      --primary-hover: #e06b0f;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-glow: rgba(242, 122, 26, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 370px;
      height: 560px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'UKIJ Tuz', 'ALKATIP Basma', 'Uyghur Pashto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      overflow-y: auto;
      padding: 16px;
    }

    body::-webkit-scrollbar {
      width: 6px;
    }
    body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #f27a1a, #ff9900);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .filter-container {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .intro-text {
      font-size: 12px;
      color: var(--text-muted);
      text-align: justify;
      text-justify: inter-word;
      text-indent: 1.5em;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-2px);
      border-color: rgba(242, 122, 26, 0.4);
    }

    .product-img {
      width: 70px;
      height: 70px;
      border-radius: 10px;
      object-fit: cover;
      background-color: rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .product-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .product-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .product-price {
      font-size: 14px;
      font-weight: 700;
      color: #2ec4b6;
      margin-bottom: 8px;
    }

    .buy-btn {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s ease, transform 0.1s ease;
      text-decoration: none;
    }

    .buy-btn:active {
      transform: scale(0.97);
    }

    footer {
      margin-top: 20px;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">IA</div>
      <div class="brand-title">IA سودا سۇپىسى</div>
    </div>
  </header>

  <p class="intro-text">
    IA Ticaret سۇپىسى ئارقىلىق Trendyol دىكى ئەڭ ئالقىشقا ئېرىشكەن سۈپەتلىك مەھسۇلاتلارنى بىۋاسىتە كۆرەلەيسىز ھەم بىرلا كۇنۇپكا ئارقىلىق Trendyol نىڭ ئورگانىق سېتىۋېلىش بەتلىرىگە ئۆتەلەيسىز.
  </p>

  <div class="filter-container">
    <button class="filter-btn active" data-category="all">ھەممىسى</button>
    <button class="filter-btn" data-category="tech">تېخنىكا</button>
    <button class="filter-btn" data-category="fashion">كىيىم-كېچەك</button>
    <button class="filter-btn" data-category="home">ئۆي بېزەك</button>
  </div>

  <div class="product-list" id="productList">
  </div>

  <footer>
    IA Ticaret &copy; 2026 | بارلىق سانلىق مەلۇماتلار يەرلىك ساقلىنىدۇ
  </footer>

  <script src="popup.js"></script>
</body>
</html>
